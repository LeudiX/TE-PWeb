{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- Fondo azul claro para coherencia visual --> 
<div class="bg-blue-50 py-6 px-2 min-h-screen">
  <div class="max-w-sm mx-auto bg-white border border-gray-300 shadow-sm rounded-md p-4">
    <div class="flex items-center justify-center mb-3">
      <i class="fas fa-paw text-blue-700 text-xl animate-bounce"></i>
      <h2 class="ml-2 text-xl font-bold text-blue-900">
        {% if modo == 'modificar' %}Modificar Animal{% else %}Insertar Animal{% endif %}
      </h2>
    </div>

    <form id="animalForm" method="POST" novalidate class="space-y-2 text-xs">

      {% csrf_token %}
      {% for field in form %}
        <div>
          <label for="{{ field.id_for_label }}" class="block text-xs font-medium text-gray-700">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <p class="text-red-600 text-xs mt-1">{{ field.errors|striptags }}</p>
          {% endif %}
        </div>
      {% endfor %}


      
      <div class="flex justify-end pt-1">
        <button type="submit"
                class="inline-flex items-center gap-1 bg-blue-600 text-white font-medium py-1 px-3 rounded hover:bg-blue-700 transition transform hover:scale-105 text-xs">
          <i class="fas fa-plus-circle"></i> {% if modo == 'modificar' %}Modificar{% else %}Insertar{% endif %}
        </button>
      </div>
    </form>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('animalForm');

  form.addEventListener('submit', (e) => {
    let valid = true;

    const nombre = form.querySelector('[name="nombre"]');
    const edad = form.querySelector('[name="edad"]');
    const especie = form.querySelector('[name="especie"]');
    const sexo = form.querySelector('[name="sexo"]');

    // Limpiar errores anteriores
    form.querySelectorAll('.js-error').forEach(el => el.remove());
    form.querySelectorAll('.border-red-500').forEach(el => el.classList.remove('border-red-500'));

    // Validar nombre
    if (!nombre.value.trim()) {
      insertError(nombre, 'El nombre no puede estar vacío.');
      valid = false;
    }

    // Validar edad
    const edadVal = Number(edad.value);
    if (!edad.value || isNaN(edadVal) || edadVal < 1 || edadVal > 24) {
      insertError(edad, 'La edad debe estar entre 1 y 24 años.');
      valid = false;
    }

    // Validar especie
    if (especie && especie.tagName === 'SELECT' && !especie.value) {
      insertError(especie, 'Debes seleccionar una especie válida.');
      valid = false;
    }

    // Validar sexo
    if (sexo && sexo.tagName === 'SELECT' && !['F', 'M'].includes(sexo.value)) {
      insertError(sexo, 'Debes seleccionar el sexo: F o M.');
      valid = false;
    }

    if (!valid) {
      e.preventDefault();
    }
  });

  function insertError(input, message) {
    const error = document.createElement('p');
    error.className = 'js-error text-red-600 text-xs mt-1 animate-fade-in';
    error.textContent = message;
    input.classList.add('border-red-500');
    input.insertAdjacentElement('afterend', error);
  }
});
</script>

<style>
@keyframes fade-in {
  from { opacity: 0; transform: translateY(-2px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {
  animation: fade-in 0.3s ease-out;
}
</style>


{% endblock %}
