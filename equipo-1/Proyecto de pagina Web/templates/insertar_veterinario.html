{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="flex justify-center bg-blue-50 py-12 px-4">
  <div class="bg-white border border-blue-300 shadow-md rounded-xl p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-blue-700 mb-6 text-center">Insertar Veterinario</h2>

    <form id="veterinarioForm" method="POST" class="space-y-4" novalidate>
      {% csrf_token %}

      {% for field in form2 %}
        <div>
          <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-blue-800 mb-1">
            {{ field.label }}
          </label>
          {{ field }}
          {% if field.errors %}
            <p class="text-red-600 text-sm mt-1">{{ field.errors|striptags }}</p>
          {% endif %}
        </div>
      {% endfor %}

      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition duration-200">
        <i class="fas fa-plus-circle mr-2"></i> INSERTAR
      </button>
    </form>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('veterinarioForm');

  form.addEventListener('submit', (e) => {
    let valid = true;

    // Campos que quieres validar
    const nombre = form.querySelector('[name="nombre"]');
    const especialidad = form.querySelector('[name="especialidad"]');

    // Limpiar errores anteriores
    form.querySelectorAll('.js-error').forEach(el => el.remove());
    form.querySelectorAll('.border-red-500').forEach(el => el.classList.remove('border-red-500'));

    // Validar nombre
    if (!nombre.value.trim()) {
      insertError(nombre, 'El nombre no puede estar vacío.');
      valid = false;
    }

    // Validar especialidad
    if (!especialidad.value.trim()) {
      insertError(especialidad, 'La especialidad es obligatoria.');
      valid = false;
    }

    if (!valid) {
      e.preventDefault();
    }
  });

  function insertError(input, message) {
    const error = document.createElement('p');
    error.className = 'js-error text-red-600 text-sm mt-1 animate-fade-in';
    error.textContent = message;

    input.classList.add('border', 'border-red-500');
    input.insertAdjacentElement('afterend', error);
  }
});
</script>

<style>
@keyframes fade-in {
  from { opacity: 0; transform: translateY(-2px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {
  animation: fade-in 0.3s ease-out;
}
</style>
{% endblock %}
