{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-blue-50 flex items-center justify-center px-4 py-8">
  <div class="bg-white border border-gray-300 shadow-md rounded-xl p-6 w-full max-w-xl">
    <h2 class="text-2xl font-bold text-blue-900 mb-6 text-center">Editar Consulta</h2>

    <form method="post" class="space-y-4 text-sm">
      {% csrf_token %}
      {% for field in form %}
        <div>
          <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
            {{ field.label }}
          </label>
          {{ field }}
          {% if field.errors %}
            <p class="text-red-600 text-xs mt-1">{{ field.errors|striptags }}</p>
          {% endif %}
        </div>
      {% endfor %}

      <div class="flex justify-center gap-4 pt-4">
        <button type="submit"
                class="inline-flex items-center gap-2 px-5 py-2.5 bg-blue-600 text-white text-sm font-semibold rounded-md hover:bg-blue-700 transition transform hover:scale-105">
          <i class="fas fa-save"></i> Guardar cambios
        </button>
        <a href="{% url 'listar_atencionM' %}"
           class="inline-flex items-center gap-2 px-5 py-2.5 bg-gray-300 text-gray-800 text-sm font-semibold rounded-md hover:bg-gray-400 transition transform hover:scale-105">
          <i class="fas fa-times-circle"></i> Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
