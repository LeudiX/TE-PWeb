{% extends 'base.html' %} {% load static %} 

{% block own_css %}
<link rel="stylesheet" href="{% static 'css/modificarProducto.css' %}" />
{% endblock %}

{% block main %}
  <!-- CONTENIDO -->
  <main class="container py-5">
      <div class="form-container p-4 rounded shadow">
          <h2 class="text-center mb-4">Modificar Producto</h2>
          <form id="formModificar" enctype="multipart/form-data">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombre del producto</label>
                    <input id="nombre" name="nombre" type="text" class="form-control">
                    <div class="error-msg" id="error-nombre"></div>
        
                    <label class="form-label mt-2">Precio de Compra</label>
                    <input id="precioCompra" name="precioCompra" type="number" class="form-control">
                    <div class="error-msg" id="error-precioCompra"></div>
        
                    <label class="form-label mt-2">Precio de Venta</label>
                    <input id="precioVenta" name="precioVenta" type="number" class="form-control">
                    <div class="error-msg" id="error-precioVenta"></div>

                    <label class="form-label mt-3">Código</label>
                    <input id="codigo" name="codigo" type="text" class="form-control">
                    <div class="error-msg" id="error-codigo"></div>
                </div>
        
                <div class="col-md-6">
                    <label class="form-label">Unidad de Medida</label>
                    <input id="unidad" name="unidad" type="text" class="form-control">
                    <div class="error-msg" id="error-unidad"></div>
        
                    <label class="form-label mt-2">Categoría</label>
                    <select id="categoria" name="categoria" class="form-select">
                        <option value="">Seleccione...</option>
                        <option value="computadoras">Computadoras</option>
                        <option value="telefonos">Teléfonos</option>
                        <option value="perifericos">Periféricos</option>
                        <option value="auriculares">Auriculares</option>
                        <option value="otros">Otros</option>
                    </select>
                    <div class="error-msg" id="error-categoria"></div>
        
                    <label class="form-label mt-2">Estado</label>
                    <select id="estado" name="estado" class="form-select">
                        <option value="">Seleccione...</option>
                        <option value="disponible">Disponible</option>
                        <option value="noDisponible">No Disponible</option>
                    </select>
                    <div class="error-msg" id="error-estado"></div>

                    <label class="form-label mt-3">Imagen</label>
            <input id="imagen" name="imagen" type="file" class="form-control">
            <div class="error-msg" id="error-imagen"></div>
            
                </div>
            </div>
        
            <label class="form-label mt-3">Descripción</label>
            <textarea id="descripcion" name="descripcion" class="form-control" rows="3"></textarea>
            <div class="error-msg" id="error-descripcion"></div>
        
            <div class="d-flex justify-content-center gap-3 mt-4">
                <div class="col"></div>
                <div class="col">
                    <button type="button" class="btn btn-secondary btn-cancelar">Cancelar</button>
                </div>
                <div class="col"></div>
                <div class="col">
                    <button type="submit" class="btn btn-primary btn-guardar">Guardar</button>
                </div>
                <div class="col"></div>
            </div>
        </form>
      </div>
  </main>
{% endblock %}

{% block own_js %}
<script src="{% static 'js/productos/modificarProducto.js' %}"></script>
{% endblock %}
