{% extends 'base.html' %} {% load static %} {% block own_css %}
<link rel="stylesheet" href="{% static 'css/registrarProducto.css' %}" />
{% endblock %} {% block main %}
<main class="container my-5 flex-grow-1">
  <section class="d-flex justify-content-center align-items-center">
    <div class="form-container card shadow p-4">
      <!-- Título del formulario -->
      <h2 class="text-center mb-4">Registrar Nuevo Producto</h2>

      <!-- Formulario -->
      <form id="formProducto">
        <div class="row g-3">
          <!-- Columna izquierda: nombre, precios -->
          <div class="col-md-6">
            <label for="nombre" class="form-label">Nombre del Producto</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              class="form-control"
              required
            />
            <div class="error-message text-danger mt-1"></div>

            <label for="precioCompra" class="form-label mt-3"
              >Precio de Compra</label
            >
            <input
              type="number"
              id="precioCompra"
              name="precioCompra"
              class="form-control"
              step="0.01"
              required
            />
            <div class="error-message text-danger mt-1"></div>

            <label for="precioVenta" class="form-label mt-3"
              >Precio de Venta</label
            >
            <input
              type="number"
              id="precioVenta"
              name="precioVenta"
              class="form-control"
              step="0.01"
              required
            />
            <div class="error-message text-danger mt-1"></div>
          </div>

          <!-- Columna derecha: stock, categoría, estado -->
          <div class="col-md-6">
            <label for="stock" class="form-label">Stock inicial</label>
            <input
              type="text"
              id="stock"
              name="stock"
              class="form-control"
              required
            />
            <div class="error-message text-danger mt-1"></div>

            <label for="categoria" class="form-label mt-3">Categoría</label>
            <select
              id="categoria"
              name="categoria"
              class="form-select"
              required
            ></select>
            <div class="error-message text-danger mt-1"></div>
          </div>
        </div>

        <!-- Descripción del producto -->
        <label for="descripcion" class="form-label mt-3">Descripción</label>
        <textarea
          id="descripcion"
          name="descripcion"
          class="form-control"
          rows="4"
          required
        ></textarea>
        <div class="error-message text-danger mt-1"></div>

        <!-- Botones de acción -->
        <div class="d-flex justify-content-between mt-4">
          <button
            type="button"
            class="btn btn-danger custom-btn"
            id="cancelarBtn"
          >
            Cancelar
          </button>
          <button type="submit" class="btn btn-success custom-btn">
            Registrar
          </button>
        </div>
      </form>
    </div>
  </section>
</main>
{% endblock %} {% block own_js %}
<!-- Bootstrap JS bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<!-- JS personalizado -->
<!-- <script src="{% static 'js/RegProd.js' %}"></script> -->
<script
  src="{% static 'js/productos/agregarCategorias.js' %}"
  type="module"
></script>
{% endblock %}
